# docker-compose.yaml
# Based on Apache Airflow's official compose, extended for courier_pipeline

x-airflow-common: &airflow-common
  build:
    context: ./airflow        # Builds from airflow/Dockerfile
  env_file:
    - .env                    # Loads everything from your single .env
  environment:
    # These override or extend what's in .env
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW__DATABASE__SQL_ALCHEMY_CONN}
    AIRFLOW__CORE__EXECUTOR: ${AIRFLOW__CORE__EXECUTOR}
    AIRFLOW__CORE__LOAD_EXAMPLES: ${AIRFLOW__CORE__LOAD_EXAMPLES}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY}
    # Your ETL variables — available inside every Airflow container
    DB_HOST: ${DB_HOST}
    DB_PORT: ${DB_PORT}
    DB_USER: ${DB_USER}
    DB_PASSWORD: ${DB_PASSWORD}
    DB_NAME: ${DB_NAME}
    GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS}
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/include:/opt/airflow/include
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
  depends_on:
    postgres:
      condition: service_healthy


services:

  # ── Single Postgres container (hosts both databases) ─────────────────
  postgres:
    image: postgres:15
    container_name: courier_postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow        # Airflow's own DB — created automatically
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
      # This script creates courier_db + schemas on first startup
      - ./docs/create_courier_db.sh:/docker-entrypoint-initdb.d/create_courier_db.sh
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "5432:5432"             # Exposed so you can connect via DBeaver/pgAdmin
    restart: always

  # ── One-time init: sets up Airflow's internal DB + admin user ─────────
  airflow-init:
    <<: *airflow-common
    container_name: airflow_init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username ${_AIRFLOW_WWW_USER_USERNAME} \
          --password ${_AIRFLOW_WWW_USER_PASSWORD} \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@courier.com
        echo "Airflow initialised successfully."
    restart: "no"             # Runs once then exits — this is correct behaviour

  # ── Scheduler: the brain that reads DAGs and triggers tasks ──────────
  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow_scheduler
    command: scheduler
    restart: always

  # ── Webserver: the UI at http://localhost:8080 ────────────────────────
  airflow-webserver:
    <<: *airflow-common
    container_name: airflow_webserver
    command: webserver
    ports:
      - "8080:8080"
    restart: always


volumes:
  postgres-db-volume:


networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1400